[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Multi-channel RAG chatbot over the Warhammer 40k core rules and unit datasheets"
authors = [
    {name = "Nils P. Kujath", email = "63961429+NilsKujath@users.noreply.github.com"},
    {name = "Varvara Smirnova"},
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "docling>=2.140,<3",
    "google-genai>=1.0",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.2",
    "langgraph>=0.2",
    "prompt-toolkit>=3.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "sentence-transformers>=5.0",
    "sqlite-vec>=0.1",
]

[tool.poetry]
packages = [{include = "rag_chatbot", from = "src"}]

[tool.poetry.group.eval.dependencies]
ragas = ">=0.4"
# ragas 0.4 imports langchain_community.chat_models.vertexai, removed in langchain-community 0.4
langchain-community = ">=0.3,<0.4"
rapidfuzz = ">=3.0"

[tool.poetry.group.dev.dependencies]
pre-commit = ">=3.0"
pytest = ">=8.0"
ruff = ">=0.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# ragas 0.4 deprecates the metric classes that still accept a custom BaseRagasLLM
filterwarnings = ["ignore:Importing .* from 'ragas.metrics' is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
